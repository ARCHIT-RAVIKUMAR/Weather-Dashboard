<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Weather Dashboard</h1>

    <form id="search-form">
      <input id="city-input" type="text" placeholder="Search for a city" aria-label="City name">
      <button type="submit">Search</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="current" hidden>
      <h2 id="place"></h2>
      <div class="now">
        <img id="icon" alt="">
        <p class="temp" id="temp"></p>
      </div>
      <p id="cond"></p>
      <ul class="details">
        <li>Feels like: <span id="feels"></span></li>
        <li>Humidity: <span id="humidity"></span></li>
        <li>Wind: <span id="wind"></span></li>
        <li>Pressure: <span id="pressure"></span></li>
      </ul>
    </section>

    <section id="forecast-section" hidden>
      <h2>5-day forecast</h2>
      <div id="forecast" class="forecast"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
